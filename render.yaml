# Render Blueprint: in Render choose New > Blueprint and pick this repository.
# Starter plan ($7/month) + a free Neon PostgreSQL database (DATABASE_URL), so data is kept.
services:
  - type: web
    name: test-portal
    runtime: node
    plan: starter            # $7/month: no sleeping. Data lives in Neon (DATABASE_URL)
    region: singapore        # pick Neon's Singapore region too, so they are close
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL      # the connection string from Neon (postgresql://...)
        sync: false
      - key: ADMIN_USER        # first central-team login
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
